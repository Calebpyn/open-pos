<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración · Admin</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    {{devTailwind}}
    <script src="/static/js/toast.js"></script>
    <script>
      function settingsApp() {
        return {
          form: null,
          taxPercent: '',
          error: '',
          busy: false,
          backups: null,
          backingUp: false,
          init: async function () {
            this.loadBackups();
            var res = await fetch('/api/admin/settings');
            if (!res.ok) return;
            this.form = await res.json();
            this.taxPercent = Math.round(this.form.tax_rate * 10000) / 100;
          },
          loadBackups: async function () {
            var res = await fetch('/api/admin/backups');
            if (res.ok) this.backups = await res.json();
          },
          backupNow: async function () {
            if (this.backingUp) return;
            this.backingUp = true;
            try {
              var res = await fetch('/api/admin/backups', { method: 'POST' });
              if (!res.ok) { toast((await res.text()) || 'No se pudo respaldar', 'error'); return; }
              toast('Respaldo creado');
              await this.loadBackups();
            } catch (e) {
              toast('No se pudo conectar con el servidor', 'error');
            } finally {
              this.backingUp = false;
            }
          },
          fmtSize: function (b) {
            return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
          },
          fmtDate: function (d) {
            return new Date(d).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' });
          },
          save: async function () {
            var staff = Number(this.form.staff_discount_pct) || 0;
            if (staff < 0 || staff > 100) { this.error = 'El descuento de colaborador debe estar entre 0 y 100%'; return; }
            this.form.staff_discount_pct = staff;
            var pct = Number(this.taxPercent);
            if (this.taxPercent === '' || isNaN(pct) || pct < 0 || pct > 100) { this.error = 'El IVA debe estar entre 0 y 100%'; return; }
            this.busy = true;
            this.error = '';
            try {
              var res = await fetch('/api/admin/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.assign({}, this.form, { tax_rate: pct / 100 }))
              });
              if (!res.ok) { this.error = (await res.text()) || 'No se pudo guardar'; return; }
              toast('Configuración guardada');
            } catch (e) {
              this.error = 'No se pudo conectar con el servidor';
            } finally {
              this.busy = false;
            }
          }
        };
      }
    </script>
    <script defer src="/static/vendor/alpinejs-3.17.4.min.js"></script>
  </head>
  <body class="bg-gray-100 min-h-screen font-sans antialiased" x-data="settingsApp()">
    {{template "admin_nav" .}}

    <main class="max-w-xl mx-auto p-4 md:p-6">
      <template x-if="form">
        <form @submit.prevent="save()" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
          <h2 class="text-lg font-black text-gray-900">Datos del negocio</h2>
          <label class="block">
            <span class="text-xs font-bold text-gray-700">Nombre del negocio</span>
            <span class="block text-[11px] text-gray-400">Aparece en tickets y cortes.</span>
            <input type="text" x-model="form.business_name" class="mt-1 w-full p-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400" />
          </label>
          <p class="text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-2">
            El pie, el logo y el diseño del ticket se editan en <a href="/admin/impresiones" class="underline font-semibold">🧾 Impresiones</a>.
          </p>

          <h2 class="text-lg font-black text-gray-900 pt-2">Impuestos</h2>
          <div class="grid grid-cols-2 gap-3 items-end">
            <label class="block">
              <span class="text-xs font-bold text-gray-700">Tasa de IVA (%)</span>
              <input type="number" min="0" max="100" step="0.01" x-model="taxPercent" class="mt-1 w-full p-2 font-mono border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400" />
            </label>
            <label class="flex items-center gap-2 text-sm pb-2">
              <input type="checkbox" x-model="form.prices_include_tax" /> Los precios ya incluyen IVA
            </label>
          </div>
          <p class="text-[11px] text-gray-400">Un cambio de IVA aplica solo a los cobros nuevos; las cuentas ya cobradas conservan el suyo.</p>

          <h2 class="text-lg font-black text-gray-900 pt-2">Colaboradores</h2>
          <label class="block">
            <span class="text-xs font-bold text-gray-700">Descuento de colaborador (%)</span>
            <span class="block text-[11px] text-gray-400">Agrega en el cobro un botón "Colaborador" con este descuento. 0 = sin botón.</span>
            <input type="number" min="0" max="100" step="0.5" x-model.number="form.staff_discount_pct" class="mt-1 w-32 p-2 font-mono border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400" />
          </label>

          <p x-show="error" x-text="error" class="text-xs font-semibold text-rose-600"></p>
          <button type="submit" :disabled="busy" class="w-full py-2.5 rounded-xl text-sm font-bold bg-slate-900 hover:bg-slate-800 text-white disabled:opacity-50">Guardar</button>
        </form>
      </template>

      <section class="mt-6 bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
        <div class="flex items-center justify-between gap-3">
          <h2 class="text-lg font-black text-gray-900">💾 Respaldos</h2>
          <button type="button" @click="backupNow()" :disabled="backingUp" class="px-3 py-2 rounded-xl text-sm font-bold bg-slate-900 hover:bg-slate-800 text-white disabled:opacity-50">
            <span x-text="backingUp ? 'Respaldando…' : 'Respaldar ahora'"></span>
          </button>
        </div>
        <p class="mt-1 text-xs text-gray-500">
          Se hace un respaldo automático cada día y se guardan los últimos <span x-text="backups ? backups.keep : 14"></span>.
          Copia alguno a una memoria USB o a la nube de vez en cuando: si el disco de esta computadora falla, los respaldos se pierden con él.
        </p>
        <template x-if="backups">
          <div>
            <p class="mt-2 text-[11px] text-gray-400 break-all">Carpeta: <span class="font-mono" x-text="backups.dir"></span></p>
            <p x-show="backups.backups.length === 0" class="mt-3 text-sm text-gray-400">Todavía no hay respaldos.</p>
            <ul class="mt-3 divide-y divide-gray-100">
              <template x-for="b in backups.backups" :key="b.name">
                <li class="flex items-center justify-between gap-3 py-2 text-sm">
                  <span class="min-w-0">
                    <span class="block font-semibold text-gray-800" x-text="fmtDate(b.created_at)"></span>
                    <span class="block text-[11px] text-gray-400 font-mono" x-text="b.name + ' · ' + fmtSize(b.size)"></span>
                  </span>
                  <a :href="'/api/admin/backups/' + encodeURIComponent(b.name)" class="shrink-0 text-xs font-bold text-slate-700 underline">Descargar</a>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </section>
    </main>
  </body>
</html>
